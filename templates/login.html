<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Member Portal Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="card login-card">
        <h2>Member Access Portal</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert alert-error">{{ messages[0] }}</div>
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="e.g. Vijay Kumar" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="e.g. vijay@gmail.com" required>
            </div>
            <button type="submit" class="btn btn-primary">Sign In</button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <p style="font-size: 12px; color: #64748b;">Authorized 6 Members Only</p>
        </div>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Overall Attendance Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="card" style="max-width: 900px;">
        <h2>Overall Attendance Records</h2>

        <a href="/download_excel" class="btn btn-excel">📥 Download Excel Report (.xlsx)</a>

        <table>
            <thead>
                <tr>
                    <th>Member Name</th>
                    <th>Email</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for row in records %}
                <tr>
                    <td style="font-weight: 600;">{{ row[0] }}</td>
                    <td>{{ row[1] }}</td>
                    <td>{{ row[2] }}</td>
                    <td>{{ row[3] }}</td>
                    <td>
                        <span class="{{ 'badge-present' if row[4] == 'Present' else 'badge-absent' }}">{{ row[4]
                            }}</span>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="5" style="color: #94a3b8;">No attendance records found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <div style="margin-top: 24px; text-align: center;">
            <a href="/" class="btn-link">← Back to Login</a>
        </div>
    </div>
</body>

</html>
